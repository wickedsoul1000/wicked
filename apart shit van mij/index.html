<!DOCTYPE html>
<html lang="nl">
<head>
<script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-6724512525970978"
     crossorigin="anonymous"></script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mijn YouTube Video's</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#0f0f0f;color:#fff}
header{padding:45px 20px;text-align:center;background:linear-gradient(135deg,#ff0000,#8b0000)}
header h1{margin:0 0 10px;font-size:clamp(30px,6vw,46px)}
header p{margin:0;color:#eee}
main{max-width:1100px;margin:35px auto;padding:0 20px}
.videos{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:25px}
.video{background:#1c1c1c;border-radius:14px;overflow:hidden;box-shadow:0 5px 20px rgba(0,0,0,.35)}
.video iframe{width:100%;aspect-ratio:16/9;border:0;display:block}
.info{padding:16px}.info h2{margin:0 0 8px;font-size:20px}.info p{margin:0;color:#bbb}
.empty{text-align:center;padding:50px 20px;background:#1c1c1c;border-radius:14px;color:#bbb}
footer{text-align:center;padding:35px 20px;color:#888}
</style>
</head>
<body>
<header>
<h1>🎬 Mijn YouTube Video's</h1>
<p>Bekijk hier mijn video's!</p>
</header>
<main>
<div class="videos" id="videos">
<div class="empty">Video's laden...</div>
</div>
</main>
<footer>© 2026 Mijn YouTube-kanaal</footer>

<script>
const videoLinks = [
  // PLAK HIER JE YOUTUBE-LINKS, ALLEEN TUSSEN DE AANHALINGSTEKENS.
  // Voorbeeld:
  // "https://www.youtube.com/watch?v=dQw4w9WgXcQ",
];

function getYouTubeId(url) {
  try {
    const u = new URL(url);
    if (u.hostname === "youtu.be") return u.pathname.substring(1).split("/")[0];
    if (u.hostname.includes("youtube.com")) {
      if (u.searchParams.has("v")) return u.searchParams.get("v");
      const parts = u.pathname.split("/");
      const i = parts.indexOf("shorts");
      if (i >= 0) return parts[i + 1];
      const e = parts.indexOf("embed");
      if (e >= 0) return parts[e + 1];
    }
  } catch(e) {}
  return null;
}

const container = document.getElementById("videos");
container.innerHTML = "";

let count = 0;
videoLinks.forEach((url) => {
  const id = getYouTubeId(url);
  if (!id) return;
  count++;
  const card = document.createElement("article");
  card.className = "video";
  card.innerHTML = `
    <iframe
      src="https://www.youtube.com/embed/${id}"
      title="YouTube video ${count}"
      loading="lazy"
      allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
      allowfullscreen>
    </iframe>
    <div class="info">
      <h2>Video ${count}</h2>
      <p>Mijn YouTube-video</p>
    </div>`;
  container.appendChild(card);
});

if (count === 0) {
  container.innerHTML = '<div class="empty">Er staan nog geen video's op de website.<br>Open <b>index.html</b> en voeg je YouTube-links toe.</div>';
}
</script>
</body>
</html>
